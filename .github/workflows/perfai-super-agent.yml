name: PerfAI Super Agent CI
on:
  push:
    paths: ["perfai-super-agent/**"]
  pull_request:
    paths: ["perfai-super-agent/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perfai-super-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: pytest -q
