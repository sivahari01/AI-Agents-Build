name: PerfAI Super Agent Tests

on:
  push:
    branches: [feature/perfai-super-performance-agent]
    paths:
      - "perfai-super-agent/**"
      - ".github/workflows/perfai-super-agent.yml"
  pull_request:
    paths:
      - "perfai-super-agent/**"
      - ".github/workflows/perfai-super-agent.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perfai-super-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: perfai-super-agent/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q .
