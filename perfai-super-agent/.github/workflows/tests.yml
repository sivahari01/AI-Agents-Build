name: PerfAI tests
on:
  push:
    paths:
      - "perfai-super-agent/**"
  pull_request:
    paths:
      - "perfai-super-agent/**"
jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perfai-super-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: perfai-super-agent/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
